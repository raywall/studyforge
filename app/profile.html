<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — StudyForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="app-layout">
  <div id="app-header"></div>
  <div id="app-sidebar"></div>

  <main class="app-main">
    <div class="page-content animate-fade-in">
      <div class="page-header">
        <div>
          <h1 class="page-title">Perfil</h1>
          <p class="page-subtitle">Consulte seus dados e altere sua senha.</p>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="card">
          <div class="card-header"><strong>Dados da conta</strong></div>
          <div class="card-body" id="profile-info"></div>
        </div>

        <form class="card" id="change-password-form">
          <div class="card-header"><strong>Trocar senha</strong></div>
          <div class="card-body" style="display:flex;flex-direction:column;gap:var(--space-4)">
            <div class="form-group">
              <label class="form-label">Senha atual</label>
              <input class="form-input" type="password" name="currentPassword" required autocomplete="current-password">
            </div>
            <div class="form-group">
              <label class="form-label">Nova senha</label>
              <input class="form-input" type="password" name="newPassword" required minlength="8" autocomplete="new-password">
            </div>
          </div>
          <div class="card-footer" style="display:flex;justify-content:flex-end">
            <button class="btn btn-primary" type="submit">Salvar senha</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<div id="toast-container"></div>

<script src="js/env.js"></script>
<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
