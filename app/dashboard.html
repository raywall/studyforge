      <!-- Two column layout -->
      <div class="dashboard-grid">

        <!-- Catalog -->
        <div class="dashboard-panel catalog-panel">
          <div class="section-header">
            <h2 class="section-title">Catálogo de Simulados</h2>
          </div>

          <!-- Filters -->
          <div class="filters-bar" id="catalog-filters">
            <div class="filter-search">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
              </svg>
              <input type="search" placeholder="Buscar…">
            </div>
          </div>

          <div class="simulations-grid" id="simulations-grid">
            <!-- Loading skeleton -->
            <div class="card" style="height:200px;animation:pulse 1.5s ease infinite;background:var(--bg-card)"></div>
            <div class="card" style="height:200px;animation:pulse 1.5s ease infinite 0.2s;background:var(--bg-card)"></div>
            <div class="card" style="height:200px;animation:pulse 1.5s ease infinite 0.4s;background:var(--bg-card)"></div>
          </div>
        </div>

        <!-- Sidebar: My Simulations -->
        <div class="dashboard-panel mysims-panel">
          <div class="section-header">
            <h2 class="section-title" id="my-sims">Meus Simulados</h2>
            <a href="dashboard.html" class="btn btn-ghost btn-sm">Ver todos</a>
          </div>
          <div id="my-simulations-list">
            <div style="height:80px;background:var(--bg-card);border-radius:var(--radius-lg);animation:pulse 1.5s ease infinite;border:1px solid var(--border-color)"></div>
          </div>
        </div>

      </div>
