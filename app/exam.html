<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulado em andamento — StudyForge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/exam.css">
</head>
<body class="exam-layout">

  <!-- Exam Header -->
  <header class="exam-header">
    <div class="exam-header-left">
      <button class="btn btn-ghost btn-sm" id="btn-back" title="Salvar e sair">← Sair</button>
      <div class="exam-title" id="exam-title">Carregando…</div>
      <div class="exam-mode-badge" id="exam-mode-badge"></div>
    </div>
    <div class="exam-header-right">
      <div class="exam-timer hidden" id="timer-wrap">
        <span class="timer-icon">⏱</span>
        <span id="timer-display">--:--</span>
      </div>
      <button class="btn btn-secondary btn-sm" type="button" data-theme-toggle><span>☾</span><span>Escuro</span></button>
      <button class="btn btn-success" id="btn-submit">Finalizar</button>
    </div>
  </header>

  <!-- Progress bar -->
  <div class="exam-progress-bar">
    <div class="exam-progress-fill" id="exam-progress-fill" style="width:0%"></div>
  </div>

  <!-- Exam body -->
  <div class="exam-body">

    <!-- Question card -->
    <div class="question-card" id="question-card">
      <div class="question-card-header">
        <span id="q-number" class="question-number">Questão <span>1</span> de —</span>
        <div id="q-category"></div>
        <div class="question-actions">
          <button class="btn-flag" id="btn-flag"><span>⚑</span><span>Marcar</span></button>
        </div>
      </div>

      <div class="question-body">
        <div class="question-text" id="q-text">
          <div style="height:20px;background:var(--bg-surface);border-radius:4px;margin-bottom:8px;animation:pulse 1.5s ease infinite"></div>
          <div style="height:20px;background:var(--bg-surface);border-radius:4px;width:70%;animation:pulse 1.5s ease infinite 0.1s"></div>
        </div>
        <div class="options-list" id="options-list">
          <div style="height:52px;background:var(--bg-secondary);border-radius:var(--radius-lg);animation:pulse 1.5s ease infinite 0.2s;border:1px solid var(--border-color)"></div>
          <div style="height:52px;background:var(--bg-secondary);border-radius:var(--radius-lg);animation:pulse 1.5s ease infinite 0.3s;border:1px solid var(--border-color)"></div>
          <div style="height:52px;background:var(--bg-secondary);border-radius:var(--radius-lg);animation:pulse 1.5s ease infinite 0.4s;border:1px solid var(--border-color)"></div>
          <div style="height:52px;background:var(--bg-secondary);border-radius:var(--radius-lg);animation:pulse 1.5s ease infinite 0.5s;border:1px solid var(--border-color)"></div>
        </div>
      </div>

      <div class="question-footer">
        <div class="question-nav">
          <button class="btn btn-secondary" id="btn-prev" disabled>← Anterior</button>
          <button class="btn btn-primary" id="btn-next">Próxima →</button>
        </div>
      </div>
    </div>

    <!-- Navigator -->
    <div class="exam-navigator">
      <div class="navigator-title">
        <span>Navegação</span>
      </div>
      <div class="navigator-grid" id="navigator-grid">
        <!-- Generated by JS -->
      </div>
      <div class="navigator-legend">
        <div class="legend-item"><div class="legend-dot unanswered"></div> Não respondida</div>
        <div class="legend-item"><div class="legend-dot answered"></div> Respondida</div>
        <div class="legend-item"><div class="legend-dot flagged"></div> Marcada para revisão</div>
        <div class="legend-item"><div class="legend-dot current"></div> Atual</div>
      </div>
      <div class="exam-summary-footer">
        <div class="summary-row">
          <span>Respondidas</span>
          <span id="summary-answered">0 / —</span>
        </div>
        <div class="summary-row">
          <span>Marcadas</span>
          <span id="summary-flagged">0</span>
        </div>
        <div class="summary-row">
          <span>Sem resposta</span>
          <span id="summary-unanswered">—</span>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/exam.js"></script>
</body>
</html>
