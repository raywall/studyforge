<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado — StudyForge</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/results.css">
</head>
<body>
<div class="app-layout">
  <div id="app-header"></div>
  <div id="app-sidebar"></div>

  <main class="app-main">
    <div class="page-content animate-fade-in">

      <!-- Breadcrumb -->
      <nav style="display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-sm);color:var(--text-muted);margin-bottom:var(--space-6)">
        <a href="dashboard.html" class="form-link" style="color:var(--text-muted)">Dashboard</a>
        <span>›</span>
        <a class="form-link" href="#" id="sim-link" style="color:var(--text-muted)">Simulado</a>
        <span>›</span>
        <span style="color:var(--text-primary)">Resultado</span>
      </nav>

      <!-- Hero Score -->
      <div class="results-hero">
        <div class="score-circle-wrapper" id="results-circle"></div>
        <div class="results-info">
          <h1 class="results-title" id="results-sim-title">—</h1>
          <div class="results-subtitle" style="display:flex;gap:var(--space-4)">
            <span id="result-mode"></span>
            <span>·</span>
            <span id="result-date"></span>
          </div>
          <div class="results-stats">
            <div class="result-stat">
              <div class="result-stat-value" style="color:var(--color-success)" id="stat-correct">—</div>
              <div class="result-stat-label">✓ Corretas</div>
            </div>
            <div class="result-stat">
              <div class="result-stat-value" style="color:var(--color-danger)" id="stat-wrong">—</div>
              <div class="result-stat-label">✗ Erradas</div>
            </div>
            <div class="result-stat">
              <div class="result-stat-value" style="color:var(--text-muted)" id="stat-skipped">—</div>
              <div class="result-stat-label">— Puladas</div>
            </div>
            <div class="result-stat">
              <div class="result-stat-value" id="stat-time">—</div>
              <div class="result-stat-label">⏱ Tempo</div>
            </div>
          </div>
          <div style="display:flex;gap:var(--space-3);margin-top:var(--space-5)">
            <button class="btn btn-primary" id="btn-retry">↺ Nova tentativa</button>
            <button class="btn btn-secondary" id="btn-back">← Voltar ao simulado</button>
          </div>
        </div>
      </div>

      <!-- Category breakdown -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-5);margin-bottom:var(--space-5)">
        <div class="card">
          <div class="card-header"><strong>Desempenho por Categoria</strong></div>
          <div class="card-body" id="category-breakdown">
            <div class="empty-state" style="padding:var(--space-6)">
              <p class="text-muted">Dados de categoria não disponíveis.</p>
            </div>
          </div>
        </div>

        <!-- Attempts history -->
        <div class="card">
          <div class="card-header"><strong>Comparativo de Tentativas</strong></div>
          <div class="card-body" style="padding:0;overflow-x:auto" id="attempts-history-wrap">
            <div id="attempts-history" style="min-width:400px"></div>
          </div>
        </div>
      </div>

      <!-- Review section -->
      <div id="review-section">
        <div class="section-header" style="margin-bottom:var(--space-4)">
          <h2 class="section-title">Revisão das Questões</h2>
          <button class="btn btn-ghost btn-sm" onclick="
            document.querySelectorAll('.review-item').forEach(el => el.classList.toggle('open'));
            Utils.renderMermaid(document.getElementById('review-list'))
          ">Expandir tudo</button>
        </div>
        <div class="review-list" id="review-list">
          <div class="empty-state"><div class="spinner"></div></div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Mode selection modal -->
<div class="modal-overlay" id="mode-modal">
  <div class="modal">
    <h3 class="modal-title">Nova tentativa</h3>
    <p style="color:var(--text-secondary);font-size:var(--text-sm);margin-bottom:var(--space-6)">Escolha o modo para esta tentativa:</p>
    <div style="display:grid;gap:var(--space-3)">
      <button class="btn btn-secondary" data-mode="learning" style="justify-content:flex-start;gap:var(--space-4);padding:var(--space-4)">
        <span style="font-size:1.5rem">📖</span>
        <div style="text-align:left">
          <div style="font-weight:600">Modo Aprendizado</div>
          <div style="font-size:var(--text-xs);color:var(--text-muted);margin-top:2px">Sem timer · Feedback por questão</div>
        </div>
      </button>
      <button class="btn btn-secondary" data-mode="training" style="justify-content:flex-start;gap:var(--space-4);padding:var(--space-4)">
        <span style="font-size:1.5rem">🏋️</span>
        <div style="text-align:left">
          <div style="font-weight:600">Modo Treino</div>
          <div style="font-size:var(--text-xs);color:var(--text-muted);margin-top:2px">Timer ativo · Resultados ao final</div>
        </div>
      </button>
    </div>
    <button class="btn btn-ghost btn-full mt-4" data-close-modal="mode-modal">Cancelar</button>
  </div>
</div>

<div id="toast-container"></div>

<script src="js/env.js"></script>
<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js?v=20260603-1"></script>
<script src="js/results.js"></script>
</body>
</html>
